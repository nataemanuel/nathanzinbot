<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | NathanBot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff; padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px; padding: 35px; border-radius: 22px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 25px 70px rgba(0,0,0,.35); backdrop-filter: blur(15px);
    }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 18px; display: grid; place-items: center;
      border-radius: 18px; background: #fff; color: #111827; font-size: 28px; font-weight: 800;
    }
    h1 { text-align: center; margin: 0 0 8px; }
    .subtitle { text-align: center; color: #cbd5e1; margin-bottom: 25px; }
    label { display: block; margin: 14px 0 7px; color: #e2e8f0; }
    input {
      width: 100%; padding: 14px 15px; border-radius: 12px; border: 1px solid #475569;
      background: #0f172a; color: #fff; outline: none;
    }
    input:focus { border-color: #94a3b8; }
    button {
      width: 100%; margin-top: 22px; padding: 14px; border: 0; border-radius: 12px;
      background: #fff; color: #0f172a; font-weight: 700; cursor: pointer; font-size: 15px;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .message { min-height: 22px; margin-top: 15px; text-align: center; font-size: 14px; }
    .link { text-align: center; margin-top: 22px; color: #cbd5e1; }
    a { color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">N</div>
    <h1>Criar sua conta</h1>
    <div class="subtitle">Cadastre-se para usar o NathanBot</div>

    <form id="cadastroForm">
      <label for="name">Nome</label>
      <input id="name" type="text" autocomplete="name" required placeholder="Seu nome">

      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required placeholder="seu@email.com">

      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="Mínimo de 6 caracteres">

      <label for="confirmPassword">Confirmar senha</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Digite novamente">

      <button id="cadastroButton" type="submit">Criar conta</button>
      <div class="message" id="message"></div>
    </form>

    <div class="link">Já possui conta? <a href="/login.html">Entrar</a></div>
  </main>

  <script>
    document.getElementById("cadastroForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");
      const button = document.getElementById("cadastroButton");

      if (password !== confirmPassword) {
        message.textContent = "As senhas não são iguais.";
        return;
      }

      button.disabled = true;
      message.textContent = "Criando conta...";

      try {
        const response = await fetch("/cadastro", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Não foi possível criar a conta");
        }

        message.textContent = "Conta criada! Redirecionando...";
        setTimeout(() => window.location.href = "/login.html", 900);
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
